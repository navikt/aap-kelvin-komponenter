name: Release from branch

on:
  workflow_dispatch:

jobs:
  release:
    name: Build & Release from branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write
      contents: write
      actions: read
      checks: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper

      - name: Sjekk at workflow ikke kjøres på main
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "❌ Denne workflow-en skal ikke kjøres på main. Bruk build-and-release.yml i stedet."
            exit 1
          fi

      - name: Compute version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          VERSION="${LATEST_TAG}-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publiserer versjon: ${VERSION}"

      - name: Build and run tests
        run: ./gradlew clean build --continue --info -x publish

      - uses: dorny/test-reporter@v3.0.0
        if: success() || failure()
        with:
          name: test
          path: "**/build/test-results/test/TEST-*.xml"
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        run: ./gradlew -Pversion=${{ steps.version.outputs.version }} publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: ${{ steps.version.outputs.version }}
          prerelease: true # Sikrer at den ikke markeres som en stabil release (latest)
          body: |
            Branch: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
